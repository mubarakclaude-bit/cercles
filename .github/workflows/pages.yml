name: Demo site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build test copy
        run: npm run build:demo
        env:
          DEMO_SITE: https://${{ github.repository_owner }}.github.io
          DEMO_BASE: /${{ github.event.repository.name }}
          PUBLIC_DEMO: '1'
          # Tracking IDs live in Settings > Secrets and variables > Actions > Variables.
          PUBLIC_GA4_ID: ${{ vars.GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.CLARITY_ID }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          PUBLIC_BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
